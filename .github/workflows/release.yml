name: Build Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to upload into (defaults to ci-<run_number>)"
        required: false
        type: string
      make_latest:
        description: "Mark release as latest"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI_PACKAGE_VERSION: 26.519.41502+ci${{ github.run_number }}

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - name: Compute release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_MAKE_LATEST: ${{ inputs.make_latest }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          elif [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
          else
            tag="ci-${GITHUB_RUN_NUMBER}"
          fi

          if [[ "$tag" == v* ]]; then
            prerelease=false
          else
            prerelease=true
          fi

          release_name="Codex Desktop Linux $tag"

          if [ "$EVENT_NAME" = "push" ] && [[ "$tag" == v* ]]; then
            make_latest=true
          else
            make_latest="${INPUT_MAKE_LATEST:-false}"
          fi

          {
            echo "tag=$tag"
            echo "release_name=$release_name"
            echo "prerelease=$prerelease"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"


  build-app:
    name: Build app from upstream DMG
    runs-on: ubuntu-latest
    needs: prepare-release
    timeout-minutes: 60
    env:
      UPSTREAM_DMG_URL: https://persistent.oaistatic.com/codex-app-prod/Codex.dmg
      UPSTREAM_DMG_PATH: /tmp/codex-upstream-release/Codex.dmg
      DMG_CACHE_SCHEMA_VERSION: v1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y p7zip-full make g++ python3 curl gzip

      - name: Capture upstream DMG metadata
        id: upstream-metadata
        run: |
          set -euo pipefail
          headers_file="$(mktemp)"
          trap 'rm -f "$headers_file"' EXIT
          curl -fsSLI "$UPSTREAM_DMG_URL" > "$headers_file"
          last_modified="$(awk 'BEGIN{IGNORECASE=1} /^last-modified:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); print; exit}' "$headers_file")"
          etag="$(awk 'BEGIN{IGNORECASE=1} /^etag:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); gsub(/"/,""); print; exit}' "$headers_file")"
          content_length="$(awk 'BEGIN{IGNORECASE=1} /^content-length:/ {sub(/\r$/,""); sub(/^[^:]+: /,""); print; exit}' "$headers_file")"
          last_modified="${last_modified:-unknown}"
          etag="${etag:-no-etag}"
          content_length="${content_length:-unknown}"
          cache_segment="$(printf '%s|%s|%s\n' "$last_modified" "$etag" "$content_length" | sha256sum | cut -d' ' -f1)"
          {
            echo "last_modified=$last_modified"
            echo "etag=$etag"
            echo "content_length=$content_length"
            echo "cache_segment=$cache_segment"
          } >> "$GITHUB_OUTPUT"

      - name: Restore cached upstream DMG
        id: dmg-cache
        uses: actions/cache@v4
        with:
          path: /tmp/codex-upstream-release/Codex.dmg
          key: upstream-dmg-${{ env.DMG_CACHE_SCHEMA_VERSION }}-${{ steps.upstream-metadata.outputs.cache_segment }}

      - name: Download upstream DMG
        if: steps.dmg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$UPSTREAM_DMG_PATH")"
          curl -fL --retry 3 -o "$UPSTREAM_DMG_PATH" "$UPSTREAM_DMG_URL"

      - name: Build app from upstream DMG
        run: |
          set -euo pipefail
          test -s "$UPSTREAM_DMG_PATH"
          CODEX_LINUX_ENABLE_COMPUTER_USE_UI=1 \
          CODEX_LINUX_FEATURES=remote-mobile-control,remote-control-ui \
          CODEX_PATCH_REPORT_JSON="$GITHUB_WORKSPACE/patch-report.json" \
            make build-app-fresh DMG="$UPSTREAM_DMG_PATH"
          node scripts/ci/validate-patch-report.js patch-report.json --profile upstream-build

      - name: Archive packaged app
        run: |
          set -euo pipefail
          test -x codex-app/start.sh
          test -f codex-app/resources/app.asar
          tar -czf codex-app.tar.gz codex-app
          ls -lh codex-app.tar.gz
          test "$(stat -c '%s' codex-app.tar.gz)" -gt 100000000

      - name: Upload packaged app artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-codex-app
          path: codex-app.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-deb:
    name: Build Debian package
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-app
    steps:
      - uses: actions/checkout@v4

      - name: Restore packaged app artifact
        uses: actions/download-artifact@v4
        with:
          name: release-codex-app

      - name: Extract packaged app
        run: |
          set -euo pipefail
          rm -rf codex-app dist
          tar -xzf codex-app.tar.gz
          test -x codex-app/start.sh
          test -f codex-app/resources/app.asar

      - name: Build Debian package
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$CI_PACKAGE_VERSION" ./scripts/build-deb.sh
          deb_file="$(find dist -maxdepth 1 -name 'codex-desktop_*.deb' -print -quit)"
          test -n "$deb_file"
          test "$(stat -c '%s' "$deb_file")" -gt 100000000

      - name: Upload Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: dist/codex-desktop_*.deb
          if-no-files-found: error

  build-rpm:
    name: Build RPM package
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-app
    steps:
      - uses: actions/checkout@v4

      - name: Install RPM tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Restore packaged app artifact
        uses: actions/download-artifact@v4
        with:
          name: release-codex-app

      - name: Extract packaged app
        run: |
          set -euo pipefail
          rm -rf codex-app dist
          tar -xzf codex-app.tar.gz
          test -x codex-app/start.sh
          test -f codex-app/resources/app.asar

      - name: Build RPM package
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$CI_PACKAGE_VERSION" ./scripts/build-rpm.sh
          rpm_file="$(find dist -maxdepth 1 -name 'codex-desktop-*.rpm' -print -quit)"
          test -n "$rpm_file"
          test "$(stat -c '%s' "$rpm_file")" -gt 100000000

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: dist/codex-desktop-*.rpm
          if-no-files-found: error

  build-pacman:
    name: Build Pacman package
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Restore packaged app artifact
        uses: actions/download-artifact@v4
        with:
          name: release-codex-app

      - name: Build and capture pacman package in Arch Linux
        run: |
          set -euo pipefail
          docker run --rm \
            -e CI_PACKAGE_VERSION="$CI_PACKAGE_VERSION" \
            -v "$PWD:/work" \
            -w /work \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed rust nodejs npm zstd sudo
              useradd -m builder
              chown -R builder:builder /work

              runuser -u builder -- bash -lc '"'"'
                set -euo pipefail
                rm -rf codex-app dist
                tar -xzf codex-app.tar.gz
                test -x codex-app/start.sh
                test -f codex-app/resources/app.asar

                cargo build --release -p codex-update-manager
                PACKAGE_VERSION="$CI_PACKAGE_VERSION" ./scripts/build-pacman.sh
                pkg_file="$(find dist -maxdepth 1 -name 'codex-desktop-*.pkg.tar.*' -print -quit)"
                test -n "$pkg_file"
                # pacman's .pkg.tar.zst recompresses the already-compressed DMG payload more efficiently
                # than deb/rpm/AppImage. Keep a lower guard than the raw app artifact, but high
                # enough to reject the old fixture-sized 4-5MB release packages.
                test "$(stat -c '%s' "$pkg_file")" -gt 40000000
              '"'"'
            '

      - name: Upload pacman artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-pacman
          path: dist/codex-desktop-*.pkg.tar.*
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-app
    steps:
      - uses: actions/checkout@v4

      - name: Restore packaged app artifact
        uses: actions/download-artifact@v4
        with:
          name: release-codex-app

      - name: Extract packaged app
        run: |
          set -euo pipefail
          rm -rf codex-app dist
          tar -xzf codex-app.tar.gz
          test -x codex-app/start.sh
          test -f codex-app/resources/app.asar

      - name: Install appimagetool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libfuse2
          curl -fsSL -o /tmp/appimagetool.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool.AppImage

      - name: Build AppImage
        env:
          APPIMAGETOOL: /tmp/appimagetool.AppImage
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$CI_PACKAGE_VERSION" ./scripts/build-appimage.sh
          appimage_file="$(find dist -maxdepth 1 -name 'codex-desktop-*.AppImage' -print -quit)"
          test -n "$appimage_file"
          test "$(stat -c '%s' "$appimage_file")" -gt 100000000

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-appimage
          path: dist/codex-desktop-*.AppImage
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - build-app
      - build-deb
      - build-rpm
      - build-pacman
      - build-appimage
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Show downloaded artifacts
        run: find release-artifacts -maxdepth 3 -type f | sort

      - name: Generate per-file SHA256 checksums
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path('release-artifacts')
          files = sorted(
              p for p in root.rglob('*')
              if p.is_file() and not p.name.endswith('.sha256')
          )
          if not files:
              raise SystemExit('No release artifacts found for checksum generation')

          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              checksum_path = path.with_name(path.name + '.sha256')
              checksum_path.write_text(f"{digest}  {path.name}\n", encoding='utf-8')
              print(checksum_path.relative_to(root).as_posix())
          PY

      - name: Build release notes
        env:
          RESOLVED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          body = """## Artifacts
          - Debian package (.deb) + `.sha256`
          - RPM package (.rpm) + `.sha256`
          - Pacman package (.pkg.tar.zst) + `.sha256`
          - AppImage (.AppImage) + `.sha256`

          ### Verify a download
          ```bash
          sha256sum -c codex-desktop-<filename>.sha256
          ```

          Built from commit: `{sha}`
          Workflow run: {run_url}
          """.format(
              sha=os.environ["RESOLVED_COMMIT_SHA"],
              run_url=f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          )
          Path('release-notes.md').write_text(body + "\n")
          PY

      - name: Publish or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.prepare-release.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare-release.outputs.make_latest }}
          files: |
            release-artifacts/release-deb/*
            release-artifacts/release-rpm/*
            release-artifacts/release-pacman/*
            release-artifacts/release-appimage/*
          fail_on_unmatched_files: true
